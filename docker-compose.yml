version: '3.9'

services:

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      SA_PASSWORD: "DomusNet2024!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DomusNet2024!' -Q 'SELECT 1' -No"]
      interval: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: DomusNet.API/Dockerfile
    ports:
      - "5242:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ConexionSQL: "Server=db,1433;Database=DomusNet;User Id=sa;Password=DomusNet2024!;TrustServerCertificate=True;"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: DomusNet.Blazor/Dockerfile
    ports:
      - "5277:80"
    depends_on:
      - api

volumes:
  sqldata:
